Name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      # NOTE: अगर प्रोजेक्ट अंदर किसी फोल्डर में है, तो यहाँ working-directory जोड़ें:
      # working-directory: ./android

    - name: Build with Gradle
      run: ./gradlew build
      # working-directory: ./android
