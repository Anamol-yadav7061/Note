name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    # NOTE: अगर आपका एंड्रॉइड प्रोजेक्ट किसी सब-फोल्डर (जैसे 'android') के अंदर है, 
    # तो नीचे दिए गए 'working-directory' का इस्तेमाल करें। अगर प्रोजेक्ट सीधे रूट में है, 
    # तो इन लाइनों से '#' हटाकर चेक करें या अगर प्रोजेक्ट रूट में है तो working-directory की जरूरत नहीं है।
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      # working-directory: ./android

    - name: Build with Gradle
      run: ./gradlew build
      # working-directory: ./android
